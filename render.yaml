services:
  - type: web
    name: email-assistant
    env: python
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt && python scripts/setup_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false

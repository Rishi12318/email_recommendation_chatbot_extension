<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Email Reply Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>AI Reply Assistant</h1>
      <span class="badge" id="status">Ready</span>
    </div>

    <div class="section" id="config-section">
      <label for="api-url">API URL</label>
      <input type="text" id="api-url" placeholder="http://localhost:8000" value="http://localhost:8000">
      <button id="save-config" class="btn btn-secondary">Save</button>
    </div>

    <div class="section" id="main-section">
      <div class="email-preview" id="email-preview">
        <p class="placeholder">Open an email in Gmail, then click "Extract Email" below.</p>
      </div>

      <div class="actions">
        <button id="extract-btn" class="btn btn-primary">Extract Email</button>
        <button id="recommend-btn" class="btn btn-success" disabled>Recommend Reply</button>
      </div>

      <div class="section" id="result-section" style="display:none">
        <label>Recommended Reply</label>
        <div class="reply-box" id="reply-box"></div>
        <div class="meta" id="meta-info"></div>
        <button id="copy-btn" class="btn btn-secondary">Copy to Clipboard</button>
      </div>
    </div>

    <div class="footer">
      <span>Powered by DistilBERT + FAISS + RAG</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Email Assistant</h1>
            <span class="status" id="status">Connected</span>
        </div>

        <div id="setup-section" class="settings-section visible">
            <div class="settings-row">
                <label for="user-name">Name</label>
                <input type="text" id="user-name" placeholder="Your name">
            </div>
            <div class="settings-row">
                <label for="user-email">Email</label>
                <input type="email" id="user-email" placeholder="your@email.com">
            </div>
            <div class="settings-row">
                <label for="user-profession">Profession</label>
                <select id="user-profession">
                    <option value="">-- Select --</option>
                    <option value="student">Student</option>
                    <option value="working">Working Professional</option>
                </select>
            </div>
            <button id="save-settings-btn">Get Started</button>
        </div>

        <div id="chat-area">
            <div id="gmail-section" class="gmail-bar">
                <button id="connect-gmail-btn" class="gmail-btn">Connect Gmail</button>
                <button id="scan-btn" class="gmail-btn" style="display:none">Scan Inbox</button>
                <span id="email-count" class="email-count"></span>
            </div>

            <div class="chat-box" id="chat-box">
                <div class="msg bot-msg">Try: "Show me emails from Amazon"</div>
            </div>

            <div class="input-area">
                <input type="text" id="user-input" class="user-input" placeholder="Type your message..." autofocus>
                <button id="send-btn" class="send-btn">Send</button>
            </div>

            <div class="actions">
                <button class="action-btn" id="summarize-btn">Summarize</button>
                <button class="action-btn" id="settings-btn">Settings</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Email Assistant</h1>
            <span class="status" id="status">Connected</span>
        </div>

        <div id="setup-section" class="settings-section visible">
            <h3 style="margin-bottom:10px">Welcome!</h3>
            <p style="font-size:12px;color:#666;margin-bottom:12px">Sign in with Google or enter details manually</p>
            <button id="google-signin-btn" class="gmail-btn" style="width:100%;margin-bottom:12px;padding:10px">Sign in with Google</button>
            <div style="border-top:1px solid #ddd;margin:8px 0;text-align:center;font-size:11px;color:#999;padding:4px">or</div>
            <div class="settings-row">
                <label for="user-name">Name</label>
                <input type="text" id="user-name" placeholder="Your name">
            </div>
            <div class="settings-row">
                <label for="user-email">Email</label>
                <input type="email" id="user-email" placeholder="your@email.com">
            </div>
            <div class="settings-row">
                <label for="user-profession">Profession</label>
                <select id="user-profession">
                    <option value="">-- Select --</option>
                    <option value="student">Student</option>
                    <option value="working">Working Professional</option>
                </select>
            </div>
            <button id="save-settings-btn">Get Started</button>
        </div>

        <div id="chat-area">
            <div class="gmail-bar">
                <span id="gmail-status" class="gmail-status">Checking Gmail...</span>
                <button id="open-gmail-btn" class="gmail-btn">Open Gmail</button>
                <button id="scan-btn" class="gmail-btn scan-btn">Scan Inbox</button>
                <span id="email-count" class="email-count"></span>
            </div>
            <div class="chat-box" id="chat-box"></div>
            <div class="input-area">
                <input type="text" id="user-input" class="user-input" placeholder="Ask about your emails..." autofocus>
                <button id="send-btn" class="send-btn">Send</button>
            </div>
            <div class="actions">
                <button class="action-btn" id="summarize-btn">Summarize</button>
                <button class="action-btn" id="settings-btn">Settings</button>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
